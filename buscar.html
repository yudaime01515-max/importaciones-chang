<body data-page="buscar">

<section class="sec-sm" style="background:var(--dk);color:#fff"><div class="wrap"><div class="crumbs"><a href="index.html">Inicio</a><span data-ic="right"></span><span>Buscar</span></div><h1 style="font-size:2.2rem" data-qtitle>Todos los productos</h1></div></section><section class="sec-sm"><div class="wrap"><div class="catalog" data-catalog data-cat="buscar">

  <div>
    
    <div class="toolbar"><button class="pill filters-btn" data-openfilters><span data-ic="filter"></span> Filtros</button><button class="pill on" data-sort="dest">Destacados</button><button class="pill " data-sort="top">Más vendidos</button><button class="pill " data-sort="new">Nuevos lanzamientos</button><button class="pill " data-sort="low">Menor precio</button><button class="pill " data-sort="high">Mayor precio</button><span class="count" data-count></span></div>
